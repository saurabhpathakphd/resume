resume_header_intro: "<p>Accomplished Ph.D. Mechanical Engineer specializing in Computational Fluid Dynamics (CFD) with over five years of combined research and industry experience. Proven ability to develop, validate, and apply sophisticated CFD models and advanced numerical techniques to solve complex thermal-fluid problems. Expertise includes multiphysics simulations, heat transfer, multiphase flow phenomena, and experimental fluid dynamics (PIV). Proficient with industry-standard CFD software (ANSYS Fluent, COMSOL Multiphysics), MATLAB scripting, and experienced in both independent and collaborative R&D environments. Seeking challenging roles leveraging advanced simulation skills to drive innovation and solve engineering problems.</p>"

